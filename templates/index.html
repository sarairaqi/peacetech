<!doctype html>
<html lang="{{ i18n.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  {% if wiki %}<title>{{ i18n.wiki.brand }}</title>
  <meta name="description" content="{{ i18n.wiki.brand }}, {{ i18n.wiki.tagline }}">{% else %}<title>Petits Plats</title>
  <meta name="description" content="Petits Plats — vos recettes du quotidien">{% endif %}
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="{{ '/static/icon-wiki.svg' if wiki else '/static/icon-192.png' }}">
  <link rel="apple-touch-icon" href="{{ '/static/icon-wiki.svg' if wiki else '/static/icon-192.png' }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="{{ i18n.wiki.brand if wiki else 'Petits Plats' }}">
  <meta name="theme-color" content="{{ '#ffffff' if wiki else '#c8412f' }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,500..800&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/demo-rec.css"> <!-- DÉMO FLAG_SECURE (retirable) -->
</head>
<body>
  <div class="stage">
    <div class="phone" id="phone">
      <div class="phone-notch"></div>
      <div class="phone-status"><span id="clock">14:50</span><span>●●● ᯤ ▮</span></div>
      <div class="screen theme-cover" id="screen"></div>
      <div id="overlays"></div>
      <div class="toast" id="toast"></div>
    </div>
    <p class="stage-hint">Prototype · hackathon — Petits Plats / Abri</p>
  </div>
  <script>window.I18N = {{ i18n | tojson }};</script>
  <script src="/static/wiki.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/demo-rec.js"></script> <!-- DÉMO FLAG_SECURE (retirable) -->
</body>
</html>
