<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Console conseil · Abri (démo)</title>
  <style>
    :root {
      --bg: #0e182b; --surface: #172540; --surface-2: #1f3155; --text: #eef2fb; --muted: #9fb0d0;
      --primary: #3dd6c8; --border: rgba(255, 255, 255, .08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: var(--font); }
    header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 12px; }
    header h1 { margin: 0; font-size: 18px; }
    header span { color: var(--muted); font-size: 13px; }
    main { flex: 1; display: flex; min-height: 0; }
    aside { width: 300px; border-right: 1px solid var(--border); overflow-y: auto; }
    .conv { display: block; width: 100%; text-align: left; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--border); background: transparent; color: inherit; font: inherit; cursor: pointer; }
    .conv:hover { background: var(--surface); }
    .conv.on { background: var(--surface-2); }
    .conv b { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
    .conv .count { color: var(--muted); font-weight: 400; font-size: 12px; }
    .conv p { margin: 4px 0 0; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); margin-right: 6px; }
    section { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .thread-head { padding: 14px 20px; border-bottom: 1px solid var(--border); font-weight: 600; }
    .thread-head small { display: block; color: var(--muted); font-weight: 400; margin-top: 2px; }
    .thread { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .bubble { max-width: 70%; padding: 10px 13px; border-radius: 16px; font-size: 14px; line-height: 1.4; white-space: pre-wrap; }
    /* Point de vue de l'intervenant·e : la personne (direction "out") à gauche, nos réponses à droite. */
    .bubble.from-user { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 4px; }
    .bubble.from-us { align-self: flex-end; background: var(--primary); color: #06262a; border-bottom-right-radius: 4px; }
    .bubble time { display: block; font-size: 11px; opacity: .7; margin-top: 4px; }
    .quick { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 20px 10px; }
    .quick button { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 12px; cursor: pointer; }
    .quick button:hover { border-color: var(--primary); }
    form { display: flex; gap: 10px; padding: 12px 20px 18px; border-top: 1px solid var(--border); }
    textarea { flex: 1; min-height: 56px; resize: vertical; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; }
    form button { border: 0; border-radius: 12px; padding: 0 20px; background: var(--primary); color: #06262a; font: inherit; font-weight: 700; cursor: pointer; }
    form button:disabled { opacity: .5; cursor: default; }
    .empty { margin: auto; color: var(--muted); text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <header><h1>Console conseil</h1><span>Démo : le côté de l'organisation qui reçoit les messages envoyés depuis Abri</span></header>
  <main>
    <aside id="convs"><div class="empty">Aucune conversation pour l'instant.<br>Envoyez un message depuis l'app.</div></aside>
    <section id="pane"><div class="empty">Choisissez une conversation</div></section>
  </main>
  <script src="/static/conseil.js"></script>
</body>
</html>
